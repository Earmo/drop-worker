name: 验证并部署

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 准备验证配置
        run: cp wrangler.example.jsonc wrangler.jsonc
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 生产构建
        run: npm run build
      - name: 检查绑定类型
        run: npm run cf:types:check
      - name: 类型检查
        run: npm run typecheck
      - name: 代码检查
        run: npm run lint
      - name: 行为测试
        run: npm run test:unit
      - name: 渲染测试
        run: npm run test:render

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 生成生产 Wrangler 配置
        id: wrangler-config
        run: node scripts/render-wrangler-config.mjs wrangler.jsonc
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          DATABASE_DRIVER: ${{ vars.DATABASE_DRIVER }}
          BLOB_DRIVER: ${{ vars.BLOB_DRIVER }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          HYPERDRIVE_ID: ${{ secrets.HYPERDRIVE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          S3_ALLOW_INSECURE: ${{ vars.S3_ALLOW_INSECURE }}
          S3_SERVER_SIDE_ENCRYPTION: ${{ vars.S3_SERVER_SIDE_ENCRYPTION }}
          S3_KMS_KEY_ID: ${{ vars.S3_KMS_KEY_ID }}
          MAX_STORAGE_BYTES: ${{ vars.MAX_STORAGE_BYTES }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SHARING_ENABLED: ${{ vars.SHARING_ENABLED }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AUTH_FROM_NAME: ${{ vars.AUTH_FROM_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TIMEOUT_MS: ${{ vars.SMTP_TIMEOUT_MS }}
      - name: 检查 Worker Secret
        env:
          BLOB_DRIVER: ${{ steps.wrangler-config.outputs.blob_driver }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          if [ ${#AUTH_SESSION_SECRET} -lt 32 ]; then
            echo "::error::AUTH_SESSION_SECRET 必须至少包含 32 个字符。"
            exit 1
          fi
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; then
            echo "::error::SMTP_USERNAME 和 SMTP_PASSWORD 必须配置。"
            exit 1
          fi
          if [ "$BLOB_DRIVER" = "r2" ] && { [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; }; then
            echo "::error::R2 浏览器直传必须配置 R2_ACCESS_KEY_ID 和 R2_SECRET_ACCESS_KEY。"
            exit 1
          fi
          if [ "$BLOB_DRIVER" = "s3" ] && { [ -z "$S3_ACCESS_KEY_ID" ] || [ -z "$S3_SECRET_ACCESS_KEY" ]; }; then
            echo "::error::Worker S3 模式必须配置 S3_ACCESS_KEY_ID 和 S3_SECRET_ACCESS_KEY。"
            exit 1
          fi
      - name: 构建
        run: npm run build
      - name: 应用 D1 迁移
        if: steps.wrangler-config.outputs.database_driver == 'sqlite'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler@4.118.0 d1 migrations apply DB --remote --config wrangler.jsonc; then
            echo "::error::D1 迁移失败。请确认 CLOUDFLARE_API_TOKEN 具备目标账号和 D1 数据库的 Edit 权限，并确认 D1_DATABASE_ID 与生产数据库一致。"
            exit 1
          fi
      - name: 应用 MySQL 或 PostgreSQL 迁移
        if: steps.wrangler-config.outputs.database_driver != 'sqlite'
        env:
          DATABASE_DRIVER: ${{ steps.wrangler-config.outputs.database_driver }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::MySQL/PostgreSQL 迁移必须配置 DATABASE_URL Secret。"
            exit 1
          fi
          npm run admin -- migrate-database
      - name: 配置 R2 浏览器直传 CORS
        if: steps.wrangler-config.outputs.blob_driver == 'r2'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ steps.wrangler-config.outputs.r2_bucket_name }}
        run: npx wrangler@4.118.0 r2 bucket cors set "$R2_BUCKET_NAME" --file "${{ steps.wrangler-config.outputs.r2_cors_config }}" --force
      - name: 部署 Worker（自定义 SMTP）
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy --config wrangler.jsonc --keep-vars
          secrets: |
            AUTH_SESSION_SECRET
            SMTP_USERNAME
            SMTP_PASSWORD
            ${{ steps.wrangler-config.outputs.blob_driver == 'r2' && 'R2_ACCESS_KEY_ID' || 'S3_ACCESS_KEY_ID' }}
            ${{ steps.wrangler-config.outputs.blob_driver == 'r2' && 'R2_SECRET_ACCESS_KEY' || 'S3_SECRET_ACCESS_KEY' }}
            ${{ steps.wrangler-config.outputs.blob_driver == 's3' && secrets.S3_SESSION_TOKEN != '' && 'S3_SESSION_TOKEN' || '' }}
        env:
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
