name: 验证并部署

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 准备验证配置
        run: cp wrangler.example.jsonc wrangler.jsonc
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 生产构建
        run: npm run build
      - name: 检查绑定类型
        run: npm run cf:types:check
      - name: 类型检查
        run: npm run typecheck
      - name: 代码检查
        run: npm run lint
      - name: 行为测试
        run: npm run test:unit
      - name: 渲染测试
        run: npm run test:render

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 生成生产 Wrangler 配置
        id: wrangler-config
        run: node scripts/render-wrangler-config.mjs wrangler.jsonc
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          AUTH_EMAIL_PROVIDER: ${{ vars.AUTH_EMAIL_PROVIDER }}
          MAX_STORAGE_BYTES: ${{ vars.MAX_STORAGE_BYTES }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SHARING_ENABLED: ${{ vars.SHARING_ENABLED }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          AUTH_FROM_EMAIL: ${{ secrets.AUTH_FROM_EMAIL }}
          AUTH_FROM_NAME: ${{ vars.AUTH_FROM_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TIMEOUT_MS: ${{ vars.SMTP_TIMEOUT_MS }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
      - name: 检查 Worker Secret
        env:
          EMAIL_PROVIDER: ${{ steps.wrangler-config.outputs.email_provider }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ ${#AUTH_SESSION_SECRET} -lt 32 ]; then
            echo "::error::AUTH_SESSION_SECRET 必须至少包含 32 个字符。"
            exit 1
          fi
          if [ "$EMAIL_PROVIDER" = "smtp" ] && { [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ]; }; then
            echo "::error::SMTP 模式必须配置 SMTP_USERNAME 和 SMTP_PASSWORD。"
            exit 1
          fi
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 浏览器直传必须配置 R2_ACCESS_KEY_ID 和 R2_SECRET_ACCESS_KEY。"
            exit 1
          fi
      - name: 构建
        run: npm run build
      - name: 应用 D1 迁移
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler@4.118.0 d1 migrations apply DB --remote --config wrangler.jsonc; then
            echo "::error::D1 迁移失败。请确认 CLOUDFLARE_API_TOKEN 具备目标账号和 D1 数据库的 Edit 权限，并确认 D1_DATABASE_ID 与生产数据库一致。"
            exit 1
          fi
      - name: 配置 R2 浏览器直传 CORS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ steps.wrangler-config.outputs.r2_bucket_name }}
        run: npx wrangler@4.118.0 r2 bucket cors set "$R2_BUCKET_NAME" --file "${{ steps.wrangler-config.outputs.r2_cors_config }}" --force
      - name: 部署 Worker（Cloudflare Email Service）
        if: steps.wrangler-config.outputs.email_provider != 'smtp'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy --config wrangler.jsonc --keep-vars
          secrets: |
            AUTH_SESSION_SECRET
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
        env:
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: 部署 Worker（自定义 SMTP）
        if: steps.wrangler-config.outputs.email_provider == 'smtp'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy --config wrangler.jsonc --keep-vars
          secrets: |
            AUTH_SESSION_SECRET
            SMTP_USERNAME
            SMTP_PASSWORD
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
        env:
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
