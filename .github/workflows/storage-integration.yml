name: 外部存储集成测试

on:
  pull_request:
  push:
    branches: [main]

jobs:
  adapters:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dropworker
          POSTGRES_PASSWORD: dropworker-test
          POSTGRES_DB: dropworker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dropworker -d dropworker"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: dropworker
          MYSQL_PASSWORD: dropworker-test
          MYSQL_DATABASE: dropworker
          MYSQL_ROOT_PASSWORD: root-test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 启动 Silo
        timeout-minutes: 5
        # 固定社区维护版本，使用镜像内置 mcli，避免依赖已不可用的上游镜像。
        run: >-
          docker run -d --name silo -p 127.0.0.1:9000:9000
          -e MINIO_ROOT_USER=dropworker -e MINIO_ROOT_PASSWORD=dropworker-test-secret
          pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
      - name: 创建私有测试桶
        timeout-minutes: 2
        run: |
          # 就绪探测有次数和请求超时限制，启动失败时不再无限等待。
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:9000/minio/health/ready; then
              docker exec silo mcli alias set local http://127.0.0.1:9000 dropworker dropworker-test-secret
              docker exec silo mcli mb --ignore-existing local/drop-worker
              exit 0
            fi
            sleep 2
          done
          echo "::error::Silo 未在限定时间内就绪。"
          exit 1
      - name: PostgreSQL 与 Silo
        env:
          RUN_EXTERNAL_STORAGE_TESTS: "true"
          DATABASE_DRIVER: postgres
          DATABASE_URL: postgresql://dropworker:dropworker-test@127.0.0.1:5432/dropworker
          BLOB_DRIVER: s3
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ALLOW_INSECURE: "true"
          S3_REGION: us-east-1
          S3_BUCKET: drop-worker
          S3_PREFIX: integration-postgres/
          S3_FORCE_PATH_STYLE: "true"
          S3_ACCESS_KEY_ID: dropworker
          S3_SECRET_ACCESS_KEY: dropworker-test-secret
        run: node --import tsx --test tests/external-storage.test.ts
      - name: MySQL 与 Silo
        env:
          RUN_EXTERNAL_STORAGE_TESTS: "true"
          DATABASE_DRIVER: mysql
          DATABASE_URL: mysql://dropworker:dropworker-test@127.0.0.1:3306/dropworker
          BLOB_DRIVER: s3
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ALLOW_INSECURE: "true"
          S3_REGION: us-east-1
          S3_BUCKET: drop-worker
          S3_PREFIX: integration-mysql/
          S3_FORCE_PATH_STYLE: "true"
          S3_ACCESS_KEY_ID: dropworker
          S3_SECRET_ACCESS_KEY: dropworker-test-secret
        run: node --import tsx --test tests/external-storage.test.ts
      - name: 输出 Silo 诊断日志
        if: failure()
        run: docker logs silo
      - name: 清理 Silo
        if: always()
        run: docker rm -f -v silo || true
