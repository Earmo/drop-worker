name: drop-worker

services:
  drop-worker:
    # 直接使用 Docker Hub 的多架构镜像；可通过 DROP_WORKER_TAG 固定到某个版本。
    image: earmo/drop-worker:${DROP_WORKER_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - drop-worker-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  drop-worker-data:
