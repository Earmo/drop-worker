services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: dropworker
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      MYSQL_DATABASE: dropworker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    ports: ["9001:9001"]

  create-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
        mc mb --ignore-existing local/drop-worker
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}

  migrate:
    build: ../..
    command: npm run admin -- migrate-database
    depends_on:
      mysql: { condition: service_healthy }
    environment: &app-env
      DATABASE_DRIVER: mysql
      DATABASE_URL: mysql://dropworker:${MYSQL_PASSWORD}@mysql:3306/dropworker
      DATABASE_ALLOW_INSECURE: "true"
      BLOB_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_ALLOW_INSECURE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: drop-worker
      S3_PREFIX: drop-worker/
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

  drop-worker:
    build: ../..
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      create-bucket: { condition: service_completed_successfully }
    environment:
      <<: *app-env
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      AUTH_MODE: password
      ADMIN_EMAIL: ${ADMIN_EMAIL:?请设置 ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?请设置 ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?请设置 SESSION_SECRET}
    ports: ["3000:3000"]

volumes:
  mysql-data:
  minio-data:
